<div class="auth-wrap">
  <section class="auth-hero">
    <p class="eyebrow">ProctorIQ</p>
    <h1>Secure exam operations, from login to certification.</h1>
    <p>Access your role-specific workspace with live monitoring and audit-ready records.</p>
  </section>

  <form (ngSubmit)="submit()" class="card">
    <h2>Welcome Back</h2>
    <label>Email
      <input [(ngModel)]="email" name="email" type="email" required />
    </label>
    <label>Password
      <input [(ngModel)]="password" name="password" type="password" required />
    </label>
    <button type="submit">Login</button>
    @if (error()) { <p class="error">{{ error() }}</p> }
    <p class="switch">New here? <a routerLink="/register">Create account</a></p>
  </form>
</div>
