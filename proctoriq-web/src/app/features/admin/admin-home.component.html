<section class="page">
  <header class="topbar">
    <h1>Admin Dashboard</h1>
    <button (click)="logout()">Logout</button>
  </header>

  @if (error()) { <p class="msg error">{{ error() }}</p> }
  @if (success()) { <p class="msg success">{{ success() }}</p> }

  <div class="grid">
    <article class="card">
      <h2>Create Exam</h2>
      <form (ngSubmit)="createExam()" class="stack">
        <label>Title <input [(ngModel)]="createModel.title" name="title" required /></label>
        <label>Duration (minutes) <input [(ngModel)]="createModel.durationMinutes" name="durationMinutes" type="number" min="1" required /></label>
        <label>Start (local) <input [(ngModel)]="createModel.startLocal" name="startLocal" type="datetime-local" required /></label>
        <label>End (local) <input [(ngModel)]="createModel.endLocal" name="endLocal" type="datetime-local" required /></label>
        <label>Total Marks <input [(ngModel)]="createModel.totalMarks" name="totalMarks" type="number" min="1" required /></label>
        <label>Pass Marks <input [(ngModel)]="createModel.passMarks" name="passMarks" type="number" min="0" required /></label>
        <label class="inline"><input [(ngModel)]="createModel.isRandomised" name="isRandomised" type="checkbox" /> Randomised questions</label>
        <button type="submit">Create Exam</button>
      </form>
    </article>

    <article class="card">
      <h2>Exams</h2>
      <button (click)="loadExams()">Refresh</button>
      @if (loading()) {
        <p>Loading exams...</p>
      } @else {
        <ul>
          @for (exam of exams(); track exam.id) {
            <li>
              <label>
                <input type="radio" name="selectedExam" [value]="exam.id" [(ngModel)]="selectedExamId" />
                <strong>{{ exam.title }}</strong> · {{ exam.status }}
              </label>
            </li>
          }
        </ul>
      }
    </article>
  </div>

  <article class="card">
    <h2>Add Question to Selected Exam</h2>
    <p>Selected Exam ID: <code>{{ selectedExamId || 'none' }}</code></p>
    <form (ngSubmit)="addQuestion()" class="stack">
      <label>Question Text <textarea [(ngModel)]="questionModel.questionText" name="questionText" rows="3" required></textarea></label>
      <div class="row">
        <label>Type
          <select [(ngModel)]="questionModel.type" name="type">
            <option value="Mcq">MCQ</option>
            <option value="TrueFalse">True/False</option>
          </select>
        </label>
        <label>Marks <input [(ngModel)]="questionModel.marks" name="marks" type="number" min="1" required /></label>
        <label>Difficulty <input [(ngModel)]="questionModel.difficulty" name="difficulty" required /></label>
        <label>Topic <input [(ngModel)]="questionModel.topic" name="topic" required /></label>
      </div>

      <label>Option A <input [(ngModel)]="questionModel.optionA" name="optionA" /></label>
      <label>Option B <input [(ngModel)]="questionModel.optionB" name="optionB" /></label>
      <label>Option C <input [(ngModel)]="questionModel.optionC" name="optionC" /></label>
      <label>Option D <input [(ngModel)]="questionModel.optionD" name="optionD" /></label>

      <label>Correct Option
        <select [(ngModel)]="questionModel.correctKey" name="correctKey">
          <option value="A">A</option>
          <option value="B">B</option>
          <option value="C">C</option>
          <option value="D">D</option>
        </select>
      </label>

      <button type="submit">Add Question</button>
    </form>
  </article>
</section>
