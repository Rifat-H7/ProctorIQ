<div class="auth-wrap">
  <form (ngSubmit)="submit()" class="card">
    <h1>Create account</h1>
    <label>Full name <input [(ngModel)]="fullName" name="fullName" required /></label>
    <label>Email <input [(ngModel)]="email" name="email" type="email" required /></label>
    <label>Password <input [(ngModel)]="password" name="password" type="password" required /></label>
    <label>Role
      <select [(ngModel)]="role" name="role">
        <option value="Candidate">Candidate</option>
        <option value="Proctor">Proctor</option>
        <option value="Admin">Admin</option>
      </select>
    </label>
    <button type="submit">Register</button>
    @if (error()) { <p class="error">{{ error() }}</p> }
    <p><a routerLink="/login">Back to login</a></p>
  </form>
</div>
